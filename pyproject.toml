[build-system]
requires = ["setuptools>=75.6.0", "wheel", "setuptools-scm[toml]>=8.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xpcsviewer-gui"
dynamic = ["version"]
description = "XPCS Viewer: A python-based interactive tool to visualize and model XPCS dataset"
readme = "README.rst"
license = {file = "LICENSE"}
authors = [
    {name = "Miaoqi Chu", email = "mqichu@anl.gov"},
    {name = "Wei Chen", email = "wchen@anl.gov"},
]
maintainers = [
    {name = "Miaoqi Chu", email = "mqichu@anl.gov"},
    {name = "Wei Chen", email = "wchen@anl.gov"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]
requires-python = ">=3.12"
keywords = ["XPCS", "X-ray", "photon correlation spectroscopy", "synchrotron", "visualization", "science"]

# ============================================================================
# GPU ACCELERATION (20-100x speedup for large datasets)
# ============================================================================
# Default: CPU-only JAX (works on ALL platforms: Linux, macOS, Windows)
#
# For GPU acceleration (Linux + NVIDIA GPU + System CUDA):
#
#   Prerequisites:
#     - System CUDA 12.x or 13.x installed (nvcc in PATH)
#     - NVIDIA GPU with SM >= 5.2 (Maxwell or newer)
#
#   Quick install (from repository):
#     make install-jax-gpu          # Auto-detect system CUDA version
#     make install-jax-gpu-cuda13   # Force CUDA 13 (requires system CUDA 13.x)
#     make install-jax-gpu-cuda12   # Force CUDA 12 (requires system CUDA 12.x)
#
#   Manual install (uses system CUDA):
#     pip uninstall -y jax jaxlib
#     pip install "jax[cuda13-local]"  # If system has CUDA 13.x
#     pip install "jax[cuda12-local]"  # If system has CUDA 12.x
#
#   GPU Compatibility:
#     CUDA 13 (SM 7.5+): RTX 20xx/30xx/40xx, T4, A100, H100, L40
#     CUDA 12 (SM 5.2+): GTX 9xx/10xx, P100, V100, plus all CUDA 13 GPUs
#
#   Platform support:
#     - Linux + NVIDIA GPU + System CUDA: Full GPU acceleration
#     - Windows WSL2: Experimental support (Linux wheels)
#     - macOS: CPU-only (no NVIDIA GPU support)
#     - Windows native: CPU-only (no pre-built wheels)
#
#   Verify your CUDA installation:
#     nvcc --version        # Should show CUDA 12.x or 13.x
#     nvidia-smi            # Should show your GPU
#
# See README.rst for detailed GPU installation guide
# ============================================================================
dependencies = [
    # GUI framework
    "pyside6>=6.10.2",
    "pyqtgraph>=0.14",
    "qtpy>=2.4",
    # Core scientific computing
    "numpy>=2.3",
    "scipy>=1.17",
    "pandas>=3.0",
    "scikit-learn>=1.8",
    "scikit-image>=0.26",
    # JAX ecosystem
    "jax>=0.8",
    "jaxlib>=0.8",
    "interpax>=0.3",
    "optimistix>=0.1",
    "optax>=0.2",
    # Bayesian inference
    "numpyro>=0.20",
    "arviz>=1.0",
    # Fitting
    "nlsq>=0.6",
    # Data handling
    "h5py>=3.15",
    "hdf5plugin>=6.0",
    # Plotting
    "matplotlib>=3.10",
    # System utilities
    "joblib>=1.5",
    "tqdm>=4.67.1",
    "psutil>=7.2",
    # Testing
    "coverage[toml]>=7.13",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-xdist[psutil]>=3.8",
    "pytest-benchmark>=5.2",
    "pytest-mock>=3.15",
    "pytest-timeout>=2.4",
    "pytest-sugar>=1.1",
    "pytest-html>=4.2",
    "pytest-qt>=4.5",
    "hypothesis>=6.148",
    # Linting and type checking
    "mypy>=1.19",
    "ruff>=0.15",
    "bandit[toml]>=1.9",
    "pre-commit>=4.5",
    # Build and publish
    "build>=1.4",
    "twine>=6.2",
    # Documentation
    "sphinx>=9.1",
    "furo>=2025.12.19",
    "myst-parser>=5.0",
    "sphinx-autodoc-typehints>=3.6",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7",
    "sphinxcontrib-mermaid>=2.0",
    # Profiling
    "memory-profiler>=0.61",
    "line-profiler>=5.0; sys_platform != 'win32'",
    "pympler>=1.1",
    # Notebooks
    "nbconvert>=7.17",
    "ipykernel>=7.2",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.4",
]

[project.scripts]
xpcsviewer = "xpcsviewer.cli_main:main"
xpcsviewer-gui = "xpcsviewer.cli_main:main_gui"

[project.urls]
"Homepage" = "https://github.com/imewei/xpcsviewer"
"Bug Tracker" = "https://github.com/imewei/xpcsviewer/issues"
"Documentation" = "https://github.com/imewei/xpcsviewer/tree/master/docs"
"Source Code" = "https://github.com/imewei/xpcsviewer"
"Changelog" = "https://github.com/imewei/xpcsviewer/blob/master/HISTORY.rst"

[tool.uv]
# Prefer uv-managed Python to guarantee reproducible environments
python-preference = "managed"

[tool.setuptools_scm]
version_scheme = "python-simplified-semver"
local_scheme = "node-and-timestamp"

[tool.setuptools.packages.find]
include = ["xpcsviewer", "xpcsviewer.*"]
exclude = ["tests*", "docs*", "validation*", "scripts*"]

[tool.setuptools.package-data]
"xpcsviewer" = [
    "configure/*.json",
    "ui/*.ui",
    "ui/resources/*.qrc",
    "ui/resources/*.png",
    "ui/resources/icons/*.svg",
    "ui/resources/icons/*.png",
    "gui/theme/styles/*.qss",
]

[tool.setuptools.data-files]
"share/xpcsviewer/docs_images" = [
    "docs/images/average.png",
    "docs/images/diffusion.png",
    "docs/images/g2_fit.png",
    "docs/images/g2_map.png",
    "docs/images/g2mod.png",
    "docs/images/hdf_info.png",
    "docs/images/intt.png",
    "docs/images/saxs1d.png",
    "docs/images/saxs2d.png",
    "docs/images/stability.png",
    "docs/images/twotime.png",
    "docs/images/qmap.png",
]
"share/xpcsviewer/test_artifacts" = [
    "tests/artifacts/offscreen_snap.png",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=xpcsviewer",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=11",
    "--maxfail=10",
    "--tb=short",
    "--durations=10",
]
# Note: --dist=loadscope is added via Makefile when running parallel tests
# to avoid conflicts when xdist is disabled (e.g., for GUI tests)
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
cache_dir = ".pytest_cache"
console_output_style = "progress"
markers = [
    # Test tier markers (for tiered CI strategy)
    "smoke: Quick smoke tests for basic functionality (< 30 seconds)",
    "unit: Unit tests for individual components",
    "integration: Integration tests across multiple components",
    "validation: Scientific validation against known results",
    "benchmark: Performance and benchmark tests",

    # Execution characteristics
    "slow: Tests that take more than 1 second",
    "gpu: Tests that require GPU",
    "jax: Tests that require JAX backend",
    "bayesian: Tests for Bayesian fitting with NumPyro",
    "critical: Critical path tests that must always pass",

    # Domain-specific markers
    "scientific: Tests that verify scientific accuracy and algorithms",
    "numerical: Tests that verify numerical computation accuracy",
    "gui: GUI tests requiring display (may be interactive)",
    "file_io: Tests for file input/output operations",
    "plotting: Tests for visualization and plotting functionality",

    # Resource requirements
    "requires_data: Tests that require external test data files",
    "requires_display: Tests that require a graphical display",
    "memory: Memory usage and leak detection tests",
    "threading: Multithreading and async operation tests",

    # Test characteristics
    "parametrize: Parametrized tests with multiple inputs",
    "error_handling: Tests for error conditions and edge cases",
    "edge_cases: Boundary conditions and extreme input tests",
    "regression: Regression tests for previously fixed bugs",
    "flaky: Tests that may fail intermittently due to external factors",

    # System and compatibility
    "system_dependent: Tests that depend on system resources or environment",
    "compatibility: Cross-platform and version compatibility tests",
    "end_to_end: Full workflow tests from file load to analysis",
    "stress: Resource exhaustion and extreme load tests",

    # Framework-specific
    "qt_validation: Qt framework validation and compatibility tests",
    "reliability: Reliability framework and robustness tests",
    "logging: Logging system functionality tests",
    "data_integrity: Tests that verify data accuracy and corruption handling",
    "performance: Performance and benchmark tests",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::RuntimeWarning:numpy.*",
    "ignore::FutureWarning:pandas.*",
    "ignore::UserWarning:matplotlib.*",
]
timeout = 300
timeout_method = "thread"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "T20", # flake8-print
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PL",  # pylint
    "RUF", # ruff-specific
]
ignore = [
    "E501",    # line too long
    "B008",    # do not perform function calls in argument defaults
    "C901",    # too complex
    "RET504",  # unnecessary variable assignment before return
    "S101",    # use of assert
    "PLR0913", # too many arguments
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B", "C", "E", "F", "W", "S", "ARG", "PLR", "PLC", "SIM", "RUF", "UP", "PLW", "SLF001", "T201"]
"validation/*" = ["T201", "S101", "S", "PLR", "PLC", "F401", "SIM"]
"scripts/*" = ["T201", "PLR"]
"xpcsviewer/cli/*" = ["PLR", "PLC", "ARG"]
"xpcsviewer/cli_main.py" = ["PLR", "PLC", "ARG"]
"xpcsviewer/constants/__init__.py" = ["RUF022"]
"xpcsviewer/fileIO/*" = ["E402", "PLR", "SIM", "S", "PLW", "PLC", "UP", "ARG", "RUF"]
"xpcsviewer/file_locator.py" = ["PLR"]
"xpcsviewer/gui/*" = ["PLR", "PLC", "ARG", "SIM", "F841"]
"xpcsviewer/utils/*" = ["PLR", "PLC", "SIM", "ARG", "B", "RUF", "PLW", "S"]
"xpcsviewer/helper/*" = ["PLR", "PLC", "ARG", "SIM"]
"xpcsviewer/module/*" = ["PLR", "PLC", "ARG", "SIM", "UP", "RUF", "B", "PLW"]
"xpcsviewer/plothandler/*" = ["PLR", "PLC", "ARG", "SIM", "S", "RUF", "B", "PLW"]
"xpcsviewer/threading/*" = ["PLR", "PLC", "ARG", "SIM", "RUF"]
"xpcsviewer/constants/*" = ["RUF022"]
"xpcsviewer/xpcs_file.py" = ["PLR", "PLC", "PLW", "ARG", "SIM"]
"xpcsviewer/xpcs_viewer.py" = ["PLR", "PLC", "ARG", "S608", "RUF034"]
"xpcsviewer/xpcs_file/__init__.py" = ["PLC", "RUF022"]
"xpcsviewer/xpcs_file/fitting.py" = ["PLR"]
"xpcsviewer/xpcs_file/memory.py" = ["F811"]
"xpcsviewer/utils/vectorized_roi.py" = ["PLR", "PLC"]
"xpcsviewer/utils/visualization_optimizer.py" = ["E402", "PLC", "SIM", "PLR"]
"xpcsviewer/viewer_kernel.py" = ["PLC", "PLR"]
"xpcsviewer/viewer_ui.py" = ["F401", "UP", "PLR"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true
disable_error_code = ["attr-defined", "name-defined"]

[tool.coverage.run]
source = ["xpcsviewer"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "xpcsviewer/ui/*",
    "xpcsviewer/icons_rc.py",
    "*/validation/*",
    "*/scripts/*",
    "xpcsviewer/cli/*",
    "xpcsviewer/viewer_ui.py",
    "xpcsviewer/ui/resources/*",
    "xpcsviewer/default_setting.py",
    "xpcsviewer/helper/logwriter.py",
    "xpcsviewer/fileIO/ftype_utils.py",
    "xpcsviewer/helper/utils.py",
    "xpcsviewer/module/tauq.py",
    "xpcsviewer/utils/common_checks.py",
    "xpcsviewer/utils/performance_monitor.py",
    "xpcsviewer/utils/reliability_manager.py",
    "xpcsviewer/utils/startup_optimizer.py",
    "xpcsviewer/utils/visualization_optimizer.py",
    "xpcsviewer/file_locator.py",
    "xpcsviewer/helper/listmodel.py",
    "xpcsviewer/module/average_toolbox.py",
    "xpcsviewer/threading/*",
    "xpcsviewer/utils/health_monitor.py",
    "xpcsviewer/utils/reliability.py",
    "xpcsviewer/utils/state_validator.py",
    "xpcsviewer/utils/validation.py",
    "xpcsviewer/utils/memory_manager.py",
    "xpcsviewer/utils/memory_predictor.py",
    "xpcsviewer/utils/streaming_processor.py",
    "xpcsviewer/utils/lazy_loader.py",
    "xpcsviewer/utils/vectorized_roi.py",
    "xpcsviewer/xpcs_viewer.py",
    "xpcsviewer/viewer_kernel.py",
    "xpcsviewer/plothandler/*",
    "xpcsviewer/gui/*",
]
branch = true
parallel = true
context = "test"
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "raise ValueError\\(.*not implemented.*\\)",
    "if 0:",
    "if False:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "@overload",
    "except ImportError:",
    "except ModuleNotFoundError:",
    "if TYPE_CHECKING:",
    "pass  # pragma: no cover",
    "\\.\\.\\.",
    "app\\.exec\\(\\)",
    "app\\.exec_\\(\\)",
    "QApplication\\.exec\\(\\)",
    "sys\\.exit\\(",
    "if platform\\.system\\(\\)",
    "except Exception as.*:",
]
precision = 2
show_missing = true
skip_covered = false
sort = "Cover"

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.bandit]
exclude_dirs = ["tests", "validation", "docs", "scripts"]
skips = ["B101", "B601", "B324", "B608"]

[tool.pip-audit]
require-hashes = false
local = false

[[tool.pip-audit.ignores]]
# pip 25.2 tarfile extraction vulnerability - fix planned for pip 25.3+
id = "GHSA-4xh5-x5gv-qwph"
reason = "No fix available yet - planned for pip 25.3. Mitigation: only install packages from trusted sources (PyPI)."
expires = "2026-06-15"  # Extended review date for pip fix

# Read the Docs configuration file for XPCS Viewer
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # RTD uses pip here; local builds should prefer `uv sync --group dev` on Python >=3.12

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py
  builder: html
  fail_on_warning: false

# Install the package (all runtime deps are in core dependencies now)
# plus docs-specific build tools from requirements.txt
python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt

# Optional but recommended, declare the Python requirements required
# to build your documentation
formats:
  - htmlzip
